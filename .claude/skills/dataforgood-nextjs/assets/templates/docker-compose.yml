# DataForGood: todo el sistema en Docker (app + PostgreSQL + MinIO).
#   Producción / demo:  docker compose up -d --build
#   Desarrollo:         docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Las variables ${...} salen del archivo .env de la raíz (copiar env.example y cambiar TODAS las claves).
name: dataforgood

services:
  postgres:
    image: postgres:17-alpine            # la base es estrictamente PostgreSQL
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]                  # sin puertos publicados: solo la app la alcanza
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  minio:
    # MinIO Community Edition, última imagen oficial publicada. NO recibe parches de seguridad
    # (ver references/almacenamiento.md). No cambiar la etiqueta sin acuerdo del equipo.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_ORIGIN}    # el navegador sube directo desde el origen de la app
    ports:
      - "${MINIO_API_PORT:-9000}:9000"              # API S3: en producción, solo detrás del proxy con TLS
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001" # consola: solo desde la máquina anfitriona
    volumes:
      - miniodata:/data
    networks: [backend]

  # Tarea única: crea el bucket privado y un usuario de la app con permisos solo sobre ese bucket.
  # Es idempotente: se ejecuta en cada arranque y termina.
  minio-setup:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    depends_on: [minio]
    restart: "no"
    entrypoint: ["/bin/sh", "/setup/setup.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./docker/minio:/setup:ro
    networks: [backend]

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RUN_MIGRATIONS: "true"
      S3_INTERNAL_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY}        # usuario de la app, NUNCA el root de MinIO
      S3_SECRET_KEY: ${MINIO_APP_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    networks: [backend]

networks:
  backend:

volumes:
  pgdata:
  miniodata:
